<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Corner - Modern Stationery Shop</title>
    <meta name="description" content="Browse and order quality stationery online - notebooks, pens, art supplies and more">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2C5F2D;
            --primary-light: #97BC62;
            --accent: #FF6B35;
            --dark: #1a1a1a;
            --gray: #6B7280;
            --light-bg: #FAF9F6;
            --white: #FFFFFF;
            --shadow: rgba(0, 0, 0, 0.1);
            --border: #E5E7EB;
        }

        [data-theme="dark"] {
            --primary: #97BC62;
            --primary-light: #2C5F2D;
            --accent: #FF8C61;
            --dark: #FAF9F6;
            --gray: #9CA3AF;
            --light-bg: #1a1a1a;
            --white: #2D2D2D;
            --shadow: rgba(255, 255, 255, 0.05);
            --border: #374151;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--light-bg);
            color: var(--dark);
            line-height: 1.6;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 3rem 1.5rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-50px, 50px) rotate(180deg); }
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero p {
            font-size: 1.1rem;
            opacity: 0.95;
            position: relative;
            z-index: 1;
            animation: slideDown 0.6s ease-out 0.2s both;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            background: var(--white);
            box-shadow: 0 2px 10px var(--shadow);
            z-index: 100;
            animation: slideDown 0.4s ease-out;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .search-container {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 3rem;
            border: 2px solid var(--border);
            border-radius: 50px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--light-bg);
            color: var(--dark);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(44, 95, 45, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        /* Theme Toggle & Cart */
        .header-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .theme-toggle, .cart-btn {
            background: var(--light-bg);
            border: 2px solid var(--border);
            padding: 0.75rem;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
        }

        .theme-toggle:hover, .cart-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            transform: scale(1.1);
        }

        .cart-btn {
            position: relative;
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Categories */
        .categories {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .category-scroll {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding: 0.5rem 0;
            scrollbar-width: none;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            padding: 0.75rem 1.5rem;
            border: 2px solid var(--border);
            background: var(--white);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-weight: 500;
            color: var(--dark);
        }

        .category-btn:hover, .category-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(44, 95, 45, 0.2);
        }

        /* Products Grid */
        .products {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .product-card {
            background: var(--white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px var(--shadow);
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease-out both;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px var(--shadow);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--light-bg);
        }

        .product-info {
            padding: 1.25rem;
        }

        .product-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: var(--dark);
        }

        .product-category {
            font-size: 0.85rem;
            color: var(--gray);
            margin-bottom: 0.75rem;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .add-to-cart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .add-to-cart-btn:hover:not(:disabled) {
            background: var(--primary-light);
            transform: scale(1.05);
        }

        .add-to-cart-btn:disabled {
            background: var(--gray);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .stock-status {
            font-size: 0.85rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-weight: 500;
        }

        .in-stock {
            background: rgba(44, 95, 45, 0.1);
            color: var(--primary);
        }

        .out-of-stock {
            background: rgba(255, 107, 53, 0.1);
            color: var(--accent);
        }

        /* Cart Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--light-bg);
            border-radius: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 2px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--white);
            border-radius: 24px 24px 0 0;
        }

        .modal-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.75rem;
            color: var(--dark);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray);
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .close-btn:hover {
            background: var(--light-bg);
            color: var(--dark);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: var(--white);
            border-radius: 12px;
            margin-bottom: 1rem;
            animation: fadeInUp 0.3s ease;
        }

        .cart-item-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            background: var(--light-bg);
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--dark);
        }

        .cart-item-price {
            color: var(--primary);
            font-weight: 600;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .qty-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .qty-btn:hover {
            background: var(--primary-light);
            transform: scale(1.1);
        }

        .qty-display {
            font-weight: 600;
            min-width: 30px;
            text-align: center;
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            padding: 0.5rem;
            transition: all 0.3s ease;
            margin-left: auto;
        }

        .remove-btn:hover {
            color: #ff4520;
            transform: scale(1.1);
        }

        .cart-total {
            background: var(--white);
            padding: 1.5rem;
            border-radius: 12px;
            margin-top: 1rem;
        }

        .cart-total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--dark);
        }

        .cart-total-price {
            color: var(--primary);
        }

        .checkout-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .checkout-btn:hover {
            background: var(--primary-light);
            transform: scale(1.02);
        }

        .empty-cart {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--gray);
        }

        .empty-cart-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        /* Checkout Form */
        .checkout-form {
            padding: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--dark);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--white);
            color: var(--dark);
            font-family: 'DM Sans', sans-serif;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(44, 95, 45, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn-secondary {
            flex: 1;
            background: var(--white);
            color: var(--dark);
            border: 2px solid var(--border);
            padding: 1rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: var(--light-bg);
        }

        /* Footer */
        .footer {
            background: var(--white);
            padding: 2rem 1.5rem;
            text-align: center;
            margin-top: 4rem;
            border-top: 2px solid var(--border);
        }

        .footer p {
            color: var(--gray);
            margin-bottom: 0.5rem;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1rem;
        }

        .footer-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .footer-link:hover {
            color: var(--primary-light);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .search-container {
                max-width: none;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1rem;
            }

            .header-content {
                flex-wrap: wrap;
            }

            .search-container {
                order: 3;
                width: 100%;
                max-width: none;
            }
        }

        /* Loading Animation */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--gray);
        }

        .no-results-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        /* Success Message */
        .success-message {
            background: var(--primary);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideDown 0.4s ease;
        }

        .success-icon {
            font-size: 1.5rem;
        }
    </style>
</head>

                    <div class="form-group">
                        <label for="customerPhone">Mobile Number *</label>

                    <div class="form-group">
                        <label for="customerAddress">Delivery Address *</label>
                        <textarea id="customerAddress" required placeholder="Enter your complete delivery address"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" id="backToCartBtn">← Back to Cart</button>
                        <button type="submit" class="checkout-btn">Send Order via WhatsApp 💬</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>📝 Student Corner - Your Local Stationery Shop</p>

            <a href="#" class="footer-link">Contact</a>
            <a href="#" class="footer-link">Privacy Policy</a>

                    price: 199,
                    category: "Office",
                    image: "https://images.unsplash.com/photo-1587825140708-dfaf72ae4b04?w=400&h=300&fit=crop",
                    stock: true
                },
                {
                    id: 10,
                    name: "Pencil Case",
                    price: 249,
                    category: "School",
                    image: "https://images.unsplash.com/photo-1612815154858-60aa4c59eaa6?w=400&h=300&fit=crop",
                    stock: true
                },
                {
                    id: 11,
                    name: "Highlighter Set",
                    price: 179,
                    category: "School",
                    image: "https://images.unsplash.com/photo-1592417817038-d13fd7ab921e?w=400&h=300&fit=crop",
                    stock: true
                },
                {
                    id: 12,
                    name: "Calligraphy Kit",
                    price: 799,
                    category: "Pens",
                    image: "https://images.unsplash.com/photo-1517971129774-8a2b38fa128e?w=400&h=300&fit=crop",
                    stock: true
                }
            ]
        };

        // State Management
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let currentCategory = 'all';
        let searchQuery = '';

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            updateCartBadge();
            initializeEventListeners();
            initializeTheme();
        });

        // Initialize Event Listeners
        function initializeEventListeners() {
            // Search
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderProducts();
            });

            // Category Filter
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentCategory = e.target.dataset.category;
                    renderProducts();
                });
            });

            // Cart Modal
            document.getElementById('cartBtn').addEventListener('click', () => {
                document.getElementById('cartModal').classList.add('active');
                renderCart();
            });

            document.getElementById('closeCartBtn').addEventListener('click', () => {
                document.getElementById('cartModal').classList.remove('active');
            });

            // Checkout Modal
            document.getElementById('closeCheckoutBtn').addEventListener('click', () => {
                document.getElementById('checkoutModal').classList.remove('active');
            });

            document.getElementById('backToCartBtn').addEventListener('click', () => {
                document.getElementById('checkoutModal').classList.remove('active');
                document.getElementById('cartModal').classList.add('active');
            });

            // Checkout Form
            document.getElementById('checkoutForm').addEventListener('submit', (e) => {
                e.preventDefault();
                sendWhatsAppOrder();
            });

            // Theme Toggle
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);

            // Close modals on outside click
            window.addEventListener('click', (e) => {
                if (e.target.classList.contains('modal')) {
                    e.target.classList.remove('active');
                }
            });
        }

        // Render Products
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            let filteredProducts = CONFIG.products;

            // Filter by category
            if (currentCategory !== 'all') {
                filteredProducts = filteredProducts.filter(p => p.category === currentCategory);
            }

            // Filter by search
            if (searchQuery) {
                filteredProducts = filteredProducts.filter(p => 
                    p.name.toLowerCase().includes(searchQuery) ||
                    p.category.toLowerCase().includes(searchQuery)
                );
            }

            if (filteredProducts.length === 0) {
                grid.innerHTML = `
                    <div class="no-results" style="grid-column: 1 / -1;">
                        <div class="no-results-icon">🔍</div>
                        <h3>No products found</h3>
                        <p>Try adjusting your search or filters</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredProducts.map((product, index) => `
                <div class="product-card" style="animation-delay: ${index * 0.1}s">
                    <img src="${product.image}" alt="${product.name}" class="product-image">
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-category">${product.category}</div>
                        <div class="product-footer">
                            <div class="product-price">₹${product.price}</div>
                            ${product.stock 
                                ? `<button class="add-to-cart-btn" onclick="addToCart(${product.id})">
                                    <span>Add</span> <span>+</span>
                                   </button>` 
                                : `<span class="stock-status out-of-stock">Out of Stock</span>`
                            }
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Add to Cart
        function addToCart(productId) {
            const product = CONFIG.products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            saveCart();
            updateCartBadge();
            
            // Visual feedback
            const badge = document.getElementById('cartBadge');
            badge.style.animation = 'none';
            setTimeout(() => badge.style.animation = 'pop 0.3s ease', 10);
        }

        // Update Cart Badge
        function updateCartBadge() {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const badge = document.getElementById('cartBadge');
            badge.textContent = totalItems;
            badge.style.display = totalItems > 0 ? 'flex' : 'none';
        }

        // Render Cart
        function renderCart() {
            const cartBody = document.getElementById('cartBody');

            if (cart.length === 0) {
                cartBody.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon">🛒</div>
                        <h3>Your cart is empty</h3>
                        <p>Add some products to get started!</p>
                    </div>
                `;
                return;
            }

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            cartBody.innerHTML = `
                ${cart.map(item => `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}" class="cart-item-image">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">₹${item.price} × ${item.quantity}</div>
                            <div class="cart-item-controls">
                                <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">−</button>
                                <span class="qty-display">${item.quantity}</span>
                                <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                            </div>
                        </div>
                        <button class="remove-btn" onclick="removeFromCart(${item.id})" title="Remove item">🗑️</button>
                    </div>
                `).join('')}
                
                <div class="cart-total">
                    <div class="cart-total-row">
                        <span>Total:</span>
                        <span class="cart-total-price">₹${total}</span>
                    </div>
                    <button class="checkout-btn" onclick="proceedToCheckout()">
                        Proceed to Checkout →
                    </button>
                </div>
            `;
        }

        // Update Quantity
        function updateQuantity(productId, change) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    removeFromCart(productId);
                } else {
                    saveCart();
                    updateCartBadge();
                    renderCart();
                }
            }
        }

        // Remove from Cart
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            saveCart();
            updateCartBadge();
            renderCart();
        }

        // Proceed to Checkout
        function proceedToCheckout() {
            document.getElementById('cartModal').classList.remove('active');
            document.getElementById('checkoutModal').classList.add('active');
        }

        // Send WhatsApp Order
        function sendWhatsAppOrder() {
            const name = document.getElementById('customerName').value;
            const phone = document.getElementById('customerPhone').value;
            const address = document.getElementById('customerAddress').value;

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            let message = `*New Order from ${CONFIG.shopName}*\n\n`;
            message += `*Customer Details:*\n`;
            message += `Name: ${name}\n`;
            message += `Phone: ${phone}\n`;
            message += `Address: ${address}\n\n`;
            message += `*Order Items:*\n`;
            
            cart.forEach(item => {
                message += `• ${item.name} - ₹${item.price} × ${item.quantity} = ₹${item.price * item.quantity}\n`;
            });
            
            message += `\n*Total Amount: ₹${total}*\n`;
            message += `\n_Payment: Cash on Delivery_`;

            const whatsappURL = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(message)}`;
            
            // Open WhatsApp
            window.open(whatsappURL, '_blank');

            // Clear cart and close modal
            setTimeout(() => {
                cart = [];
                saveCart();
                updateCartBadge();
                document.getElementById('checkoutModal').classList.remove('active');
                document.getElementById('checkoutForm').reset();
                
                // Show success message
                alert('✅ Order sent successfully! Please complete your order on WhatsApp.');
            }, 1000);
        }

        // Save Cart to LocalStorage
        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        // Theme Toggle
        function initializeTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            document.getElementById('themeIcon').textContent = theme === 'light' ? '🌙' : '☀️';
        }
    </script>
</body>
</html>
